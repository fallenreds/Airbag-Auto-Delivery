services: 
  frontend:
    # Имя образа задано явно. Без него compose называет образ по каталогу
    # проекта (airbag-auto-delivery-frontend), и выкат через
    # `docker save | ssh docker load` под другим тегом молча не доезжал:
    # образ загружался, контейнер пересоздавался — и поднимался на старом.
    image: airbagad-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Адрес API вшивается в приложение на этапе сборки. Значение задаётся
        # здесь, а не берётся из frontend/.env.local: тот приезжает в образ
        # вместе с исходниками, и собранный на чужой машине образ уносил на
        # прод её локальный адрес. Переопределяется переменной окружения.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.airbagad.com/api/v2}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      # Server-side (SSR/sitemap/generateMetadata) reaches the backend via the
      # compose network name — `localhost` inside this container is not the backend.
      - API_BASE_URL_INTERNAL=http://backend:8000/api/v2
    depends_on:
      - backend

  backend:
    build: backend/
    ports:
      # Только loopback: наружу backend ходит через nginx с TLS. Раньше порт
      # висел на 0.0.0.0, и форма входа в Django-админку была доступна из
      # интернета по обычному HTTP — пароль уходил открытым текстом.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      # Загруженные файлы — вне рабочей копии репозитория. Внутри неё они
      # неотличимы от мусора для git: `git clean -xdf` снёс бы и картинки
      # категорий, и подтверждения оплаты клиентов. Плюс nginx отдаёт
      # /media/categories/ напрямую, а до /root он не дотягивается: каталог
      # закрыт на drwx------, и www-data получал бы 403.
      - ${AIRBAG_MEDIA_DIR:-/var/lib/airbag/media}:/app/media
    restart: unless-stopped
    env_file:
      - backend/.env 
    depends_on:
      - redis    
  bot:
    build: bot/
    ports:
      # 5678 — порт отладчика debugpy, нужен только при локальной отладке.
      - "127.0.0.1:88:88"
      - "127.0.0.1:5678:5678"
    # Без этого упавший бот лежит до тех пор, пока кто-нибудь не заметит.
    restart: unless-stopped
    env_file:
      - ./bot/.env
  celery:
    build: backend/
    # Миграции и статику накатывает backend — воркеру достаточно дождаться его.
    entrypoint: []
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      - redis
      - backend
  redis:
    image: redis:7-alpine
    restart: unless-stopped
